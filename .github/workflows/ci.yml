name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The engine and CLIs are dependency-free (stdlib only); build tooling is installed in the separate build job.
      - name: Browser registry is in sync with src/ai/providers.mjs
        run: node scripts/sync-browser-registry.mjs --check
      - name: Shipped example config passes schema validation
        run: node scripts/ai-setup-wizard.mjs --validate --config quilltest.ai.example.json
      - name: Syntax-check every module
        run: for f in src/ai/*.mjs src/verify/*.mjs src/scan/*.mjs src/fix/*.mjs src/report/*.mjs src/commands/*.mjs src/targets/*.mjs scripts/*.mjs electron/*.js electron/*.mjs vite.config.js; do node --check "$f"; done
      - name: Unit tests (offline)
        run: npm test
      - name: Analysis dry-run against the sample findings needs no keys
        run: |
          cp quilltest.ai.example.json quilltest.ai.json
          node scripts/ai-analyze.mjs --findings examples/findings.sample.json --dry-run
      - name: Fix generator runs on a synthetic report
        run: |
          node -e "require('fs').writeFileSync('/tmp/r.json', JSON.stringify({origin:'https://x.test',stack:{server:{name:'nginx'},framework:[],cms:[]},assets:{scriptOrigins:['https://cdn.test'],styleOrigins:[],frameOrigins:[],inlineScripts:false,inlineStyles:false,eventHandlers:false},findings:[{id:'F-001',checkId:'headers.csp',title:'t',remediation:'r'}]}))"
          node scripts/fix.mjs --report /tmp/r.json --all --out /tmp/fixes | grep -q 'quilltest-security-headers.nginx.conf'
      - name: Report renderer and review package run on the synthetic report
        run: |
          node scripts/report.mjs --report /tmp/r.json --format all --out /tmp/report/
          test -s /tmp/report/r.html && test -s /tmp/report/r.md && test -s /tmp/report/r.csv
          node scripts/report.mjs --report /tmp/r.json --package /tmp/review
          node scripts/report.mjs --verify /tmp/review
      - name: Active engine self-check (offline, no network)
        run: node --test tests/active.test.mjs
      - name: Staging-mirror self-check (offline; loopback server)
        run: node --test tests/mirror.test.mjs
      - name: Command registry is well-formed
        run: node scripts/commands.mjs --validate
      - name: Browser shell is in sync with the command registry
        run: node scripts/sync-shell-registry.mjs --check
      - name: Dependency patch applies cleanly with git apply
        run: |
          printf '{\n  "dependencies": {\n    "jquery": "^1.12.4"\n  }\n}\n' > /tmp/package.json
          node -e "require('fs').writeFileSync('/tmp/depscan.json', JSON.stringify({findings:[{id:'F-1',checkId:'components.eol',title:'jQuery 1.12.4',component:'jQuery',version:'1.12.4',evidence:{component:'jQuery',version:'1.12.4'}}]}))"
          node scripts/fix.mjs --report /tmp/depscan.json --patch /tmp/package.json --out /tmp/pfix
          ( cd /tmp && git apply --check pfix/package.json.patch )
          grep -q '3.7.1' /tmp/pfix/package.json.patch
      - name: Scan gate refuses an unverified origin (exit 3)
        run: |
          set +e
          node scripts/scan.mjs scan https://example.com --store /tmp/qt-empty-store
          code=$?
          set -e
          test "$code" -eq 3
      - name: Protocols gate refuses an unverified host (exit 3)
        run: |
          set +e; node scripts/scan.mjs protocols example.com --store /tmp/qt-empty2 >/dev/null 2>&1; code=$?; set -e; test "$code" -eq 3
      - name: No literal secrets committed
        run: |
          # The example config and sample findings must never carry real-looking keys.
          ! grep -rEn '"apiKey": *"[^"n]' quilltest.ai.example.json
          ! git grep -En 'sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}' -- . ':!tests/' ':!SECURITY.md' || (echo "key-shaped string committed" && exit 1)

  build:
    name: Web build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tooling
        run: npm ci
      - name: Build the web app
        run: npm run build
      - name: Built output exists
        run: test -s dist/index.html && test -s dist/public/shell.html && test -s dist/public/ai-wizard.html
      - name: Shell build is in sync with the command registry
        run: node scripts/sync-shell-registry.mjs --check
