# Anne's Test — cross-platform desktop release (parity with Anne's Stage).
# Builds the web app and packages the Electron desktop app for Linux, macOS and
# Windows when a version tag is pushed, attaching the installers to the GitHub
# release. Mobile (Capacitor/Android/iOS) is built from a maintainer machine
# with the platform SDKs, not here. This workflow is scaffolded to spec; it is
# exercised when a maintainer pushes a tag, not in the per-commit CI.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.2.0 (for sessions that can push branches but not tags). Empty: build only'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Build web + package desktop
        run: npm run electron:build -- --publish never
      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Anne's Test ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
